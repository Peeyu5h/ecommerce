<div class="grid grid-cols-3 grid-cols-[1fr_1fr_1fr]">
    <div class="flex items-center gap-4">
        <img [src]="item().image" class="w-24 h-24 rounded-lg object-cover " />
        <div class="text-gray-900 text-lg ">{{ item().name }}</div>
    </div>

    <div class="flex items-center gap-4">
        <div class="text-gray-600 text-lg ">₹ {{ item().priceAtPurchase }}</div>
    </div>

    <div class="flex items-center gap-4">
        <div>
            <div class="text-gray-900 text-lg font-semibold ">{{ item().status | titlecase }} on {{ item().updatedTime | date: "d'th' MMM"}}</div>
            <div class="text-gray-600 text-sm ">your order has been processed</div>
        </div>
    </div>
</div>
